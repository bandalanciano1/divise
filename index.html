<!DOCTYPE html>
<html lang="it"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guardaroba Pro - Gestione Divise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .accordion-content { 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .accordion-content.open { 
            max-height: 2000px; 
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(226, 232, 240, 0.8);
        }

        .login-gradient {
            background: radial-gradient(circle at top right, #4f46e5, #312e81);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

<!-- MODALE PERSONALIZZATO -->
<div id="custom-modal" class="hidden fixed inset-0 z-[200] flex items-center justify-center p-6 bg-slate-900/40 backdrop-blur-sm">
    <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl animate-fade-in text-center border border-slate-100">
        <div id="modal-icon" class="mx-auto mb-4 w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center">
            <i data-lucide="info" class="w-6 h-6"></i>
        </div>
        <h3 id="modal-title" class="text-xl font-extrabold text-slate-800 mb-2 uppercase tracking-tight"></h3>
        <p id="modal-message" class="text-sm text-slate-500 mb-8 font-medium"></p>
        <div id="modal-actions" class="flex gap-3 justify-center"></div>
    </div>
</div>

<!-- SCHERMATA LOGIN -->
<div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center p-6 login-gradient">
    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-8 sm:p-10 border border-white/20 animate-fade-in">
        <div class="text-center mb-10">
            <div class="bg-indigo-600 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-2xl shadow-indigo-500/50 rotate-3">
                <i data-lucide="shirt" class="w-10 h-10 text-white"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight uppercase">Guardaroba</h1>
            <p class="text-slate-400 font-bold text-xs mt-2 uppercase tracking-widest italic">Sistema Gestione Divise</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div class="relative">
                <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                <input type="text" id="username" placeholder="Nome utente" class="w-full pl-12 pr-4 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:outline-none transition-all font-semibold" required>
            </div>
            <div class="relative">
                <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                <input type="password" id="password" placeholder="Password" class="w-full pl-12 pr-4 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:outline-none transition-all font-semibold" required>
            </div>

            <div class="flex items-center px-2 py-2">
                <label class="flex items-center cursor-pointer group">
                    <input type="checkbox" id="remember-me" class="w-5 h-5 border-2 border-slate-200 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                    <span class="ml-3 text-sm font-bold text-slate-600 group-hover:text-indigo-600 transition-colors">Resta collegato</span>
                </label>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-xl shadow-indigo-200 transition-all active:scale-95 flex items-center justify-center gap-2 uppercase tracking-tighter text-lg">
                Accedi <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </form>
        <p id="login-error" class="hidden mt-6 text-red-500 text-xs font-black text-center uppercase tracking-widest bg-red-50 p-3 rounded-xl border border-red-100 italic">Credenziali non valide</p>
    </div>
</div>

<!-- APP PRINCIPALE -->
<div id="main-app" class="hidden flex flex-col min-h-screen">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-xl shadow-lg">
                <i data-lucide="shirt" class="w-5 h-5 text-white"></i>
            </div>
            <div>
                <h2 class="font-extrabold text-slate-800 text-base uppercase leading-none tracking-tighter">Guardaroba Pro</h2>
                <span id="header-subtitle" class="text-[10px] text-indigo-500 font-bold uppercase tracking-widest">Dashboard Attiva</span>
            </div>
        </div>
        <button onclick="logout()" class="p-2 text-slate-300 hover:text-red-500 transition-colors">
            <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
    </header>

    <main class="flex-1 p-4 sm:p-6 max-w-4xl w-full mx-auto pb-32">
        
        <!-- VISTA CONSEGNE -->
        <div id="tab-consegne" class="tab-content active">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></div>
                    <h2 class="text-xl font-extrabold text-slate-800 uppercase tracking-tight italic">Località</h2>
                </div>
                <div class="flex gap-4">
                    <button onclick="clearCache()" class="text-[10px] font-bold uppercase text-red-400 hover:text-red-600 transition-colors">Reset</button>
                    <button onclick="fetchSheetData()" class="flex items-center gap-2 bg-white border border-slate-200 px-4 py-2 rounded-xl text-[10px] font-black uppercase text-indigo-600 hover:bg-indigo-50 transition-all shadow-sm">
                        <i data-lucide="refresh-cw" class="w-3 h-3"></i> Sync
                    </button>
                </div>
            </div>

            <div id="list-container" class="space-y-4">
                <!-- Caricamento -->
            </div>
        </div>

        <!-- VISTA ARCHIVIO -->
        <div id="tab-archivio" class="tab-content">
            <div class="mb-8">
                <h2 class="text-xl font-extrabold text-slate-800 uppercase tracking-tight italic">Archivio</h2>
                <p class="text-xs text-slate-400 font-medium italic">Località completate rimosse dalla vista principale.</p>
            </div>
            <div id="archive-container" class="space-y-4"></div>
        </div>
    </main>

    <!-- NAVIGAZIONE -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-sm glass-nav rounded-[2.5rem] shadow-2xl px-10 py-4 flex justify-between items-center z-50 border border-white/50">
        <button onclick="switchTab('consegne')" id="nav-consegne" class="flex flex-col items-center gap-1 text-indigo-600 scale-110 transition-all">
            <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
            <span class="text-[9px] font-black uppercase tracking-tighter">Dashboard</span>
        </button>
        <button onclick="switchTab('archivio')" id="nav-archivio" class="flex flex-col items-center gap-1 text-slate-400 transition-all relative">
            <div class="relative">
                <i data-lucide="package-check" class="w-6 h-6"></i>
                <span id="badge-archivio" class="hidden absolute -top-1 -right-2 bg-red-500 text-white text-[8px] font-black px-1.5 py-0.5 rounded-full border border-white">0</span>
            </div>
            <span class="text-[9px] font-black uppercase tracking-tighter">Archivio</span>
        </button>
    </nav>
</div>

<script>
    // UTILS
    const utils = {
        escapeHTML: (str) => {
            if (!str) return '';
            return str.toString().replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        },
        escapeJS: (str) => {
            if (!str) return '';
            return str.toString().replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    };

    const CONFIG = {
        sheetId: '1fSkpwqDJdoc_7IY1pkTtlhsbUIt-OdiY7Wrh0B0VXSE',
        gid: '1888602811',
        u: "Z3VhcmRhcm9iYTE=", // guardaroba1
        p: "ZGl2aXNlMjAyNA=="  // divise2024
    };

    let state = {
        data: {},
        delivered: new Set(),
        archived: new Set(),
        openAccordion: null
    };

    window.onload = () => {
        lucide.createIcons();
        if (localStorage.getItem('guardaroba_session') === 'active') {
            initApp();
        }
        document.getElementById('login-form').addEventListener('submit', handleLogin);
    };

    function showMessage(title, message, icon = 'info') {
        const modal = document.getElementById('custom-modal');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-message').innerText = message;
        document.getElementById('modal-icon').innerHTML = `<i data-lucide="${icon}" class="w-6 h-6"></i>`;
        document.getElementById('modal-icon').className = `mx-auto mb-4 w-12 h-12 rounded-full flex items-center justify-center ${icon === 'alert-circle' ? 'bg-red-50 text-red-600' : 'bg-indigo-50 text-indigo-600'}`;
        document.getElementById('modal-actions').innerHTML = `<button onclick="closeModal()" class="w-full px-6 py-3 bg-indigo-600 text-white font-black uppercase tracking-tight rounded-2xl hover:bg-indigo-700 transition-colors">OK</button>`;
        modal.classList.remove('hidden');
        lucide.createIcons();
    }

    function showConfirm(title, message, onConfirm) {
        const modal = document.getElementById('custom-modal');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-message').innerText = message;
        document.getElementById('modal-icon').innerHTML = `<i data-lucide="alert-triangle" class="w-6 h-6"></i>`;
        document.getElementById('modal-icon').className = `mx-auto mb-4 w-12 h-12 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center`;
        document.getElementById('modal-actions').innerHTML = `
            <button onclick="closeModal()" class="flex-1 px-4 py-3 bg-slate-100 text-slate-600 font-bold uppercase tracking-tight rounded-2xl hover:bg-slate-200 transition-colors">Annulla</button>
            <button id="modal-confirm-btn" class="flex-1 px-4 py-3 bg-red-500 text-white font-black uppercase tracking-tight rounded-2xl hover:bg-red-600 transition-colors shadow-lg shadow-red-200">Conferma</button>
        `;
        document.getElementById('modal-confirm-btn').onclick = () => {
            closeModal();
            onConfirm();
        };
        modal.classList.remove('hidden');
        lucide.createIcons();
    }

    function closeModal() {
        document.getElementById('custom-modal').classList.add('hidden');
    }

    function handleLogin(e) {
        e.preventDefault();
        const uInput = document.getElementById('username').value;
        const pInput = document.getElementById('password').value;
        
        if (uInput === atob(CONFIG.u) && pInput === atob(CONFIG.p)) {
            if (document.getElementById('remember-me').checked) {
                localStorage.setItem('guardaroba_session', 'active');
            }
            initApp();
        } else {
            const err = document.getElementById('login-error');
            err.classList.remove('hidden');
            setTimeout(() => err.classList.add('hidden'), 3000);
        }
    }

    function initApp() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        loadLocalData();
        fetchSheetData();
    }

    function logout() {
        localStorage.removeItem('guardaroba_session');
        location.reload();
    }

    function loadLocalData() {
        const saved = localStorage.getItem('guardaroba_storage_v5');
        if (saved) {
            const parsed = JSON.parse(saved);
            state.delivered = new Set(parsed.delivered || []);
            state.archived = new Set(parsed.archived || []);
        }
    }

    function saveLocalData() {
        localStorage.setItem('guardaroba_storage_v5', JSON.stringify({
            delivered: Array.from(state.delivered),
            archived: Array.from(state.archived)
        }));
    }

    async function fetchSheetData() {
        const list = document.getElementById('list-container');
        list.innerHTML = `<div class="py-24 flex flex-col items-center justify-center opacity-25">
                            <i data-lucide="loader-2" class="w-12 h-12 animate-spin mb-4 text-indigo-600"></i>
                            <span class="font-bold uppercase text-xs tracking-[0.2em]">Sincronizzazione dati...</span>
                        </div>`;
        lucide.createIcons();

        const url = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:json&gid=${CONFIG.gid}`;
        
        try {
            const res = await fetch(url);
            const text = await res.text();
            const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
            const rows = json.table.rows || [];
            
            // Filtra e raggruppa
            const grouped = {};
            rows.forEach(r => {
                const check = r.c[12]?.v?.toString().toLowerCase();
                if (check && check.includes('si')) {
                    const loc = r.c[6]?.v?.toString() || "Varie";
                    const nome = r.c[1]?.v?.toString() || "N.D.";
                    const id = `id-${nome.toLowerCase().replace(/[^a-z0-9]/g, '')}-${loc.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
                    
                    if (!grouped[loc]) grouped[loc] = [];
                    grouped[loc].push({ id, nome });
                }
            });
            
            state.data = grouped;
            render();
        } catch (err) {
            console.error(err);
            showMessage("Errore Sync", "Impossibile caricare i dati. Verifica la connessione.", "alert-circle");
        }
    }

    function render() {
        const list = document.getElementById('list-container');
        const archive = document.getElementById('archive-container');
        const badge = document.getElementById('badge-archivio');
        
        list.innerHTML = '';
        archive.innerHTML = '';
        let archCount = 0;

        const entries = Object.entries(state.data);
        
        if (entries.length === 0) {
            list.innerHTML = `<div class="py-24 text-center opacity-40"><p class="font-bold uppercase text-xs">Nessun dato trovato</p></div>`;
        }

        entries.forEach(([loc, staff]) => {
            const isArchived = state.archived.has(loc);
            const doneCount = staff.filter(s => state.delivered.has(s.id)).length;
            const total = staff.length;
            const isComplete = doneCount === total;
            const isOpen = state.openAccordion === loc;

            const card = document.createElement('div');
            card.className = `bg-white rounded-[2rem] border transition-all overflow-hidden mb-4 ${isComplete ? 'border-indigo-100' : 'border-slate-100 shadow-lg'}`;
            
            const headBg = isComplete ? 'bg-indigo-600' : 'bg-slate-900';
            
            card.innerHTML = `
                <div class="${headBg} p-5 flex items-center justify-between cursor-pointer" onclick="toggleAccordion(this, '${utils.escapeJS(loc)}')">
                    <div class="flex items-center gap-4 flex-1">
                        <div class="bg-white/10 p-2 rounded-xl text-white"><i data-lucide="map-pin" class="w-4 h-4"></i></div>
                        <div>
                            <h4 class="text-white font-extrabold uppercase text-xs tracking-tight">${utils.escapeHTML(loc)}</h4>
                            <p class="text-[9px] font-bold ${isComplete ? 'text-indigo-200' : 'text-slate-400'} uppercase mt-1">${doneCount}/${total} CONSEGNATE</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                         <button onclick="event.stopPropagation(); toggleArchive('${utils.escapeJS(loc)}', ${!isArchived})" class="p-2 rounded-xl bg-white/10 text-white hover:bg-white/20 transition-all ${!isComplete && !isArchived ? 'opacity-0 pointer-events-none' : ''}">
                            <i data-lucide="${isArchived ? 'rotate-ccw' : 'archive'}" class="w-4 h-4"></i>
                        </button>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-white/30 transition-transform ${isOpen ? 'rotate-180' : ''}"></i>
                    </div>
                </div>
                <div class="accordion-content ${isOpen ? 'open' : ''}">
                    <div class="p-4 grid grid-cols-1 gap-2 bg-slate-50/50">
                        ${staff.map(s => {
                            const isDone = state.delivered.has(s.id);
                            return `
                                <button onclick="toggleItem('${utils.escapeJS(s.id)}')" ${isArchived ? 'disabled' : ''} class="flex items-center gap-3 p-4 rounded-2xl border transition-all ${isDone ? 'bg-green-50 border-green-200' : 'bg-white border-slate-100'}">
                                    <div class="w-5 h-5 rounded-lg border-2 flex-shrink-0 flex items-center justify-center ${isDone ? 'bg-green-500 border-green-500' : 'border-slate-200'}">
                                        <i data-lucide="check" class="w-3 h-3 text-white ${isDone ? '' : 'hidden'}"></i>
                                    </div>
                                    <span class="font-bold text-[11px] uppercase truncate ${isDone ? 'text-green-700 line-through opacity-50' : 'text-slate-600'}">${utils.escapeHTML(s.nome)}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;

            if (isArchived) {
                archive.appendChild(card);
                archCount++;
            } else {
                list.appendChild(card);
            }
        });

        badge.innerText = archCount;
        archCount > 0 ? badge.classList.remove('hidden') : badge.classList.add('hidden');
        lucide.createIcons();
    }

    function toggleAccordion(btn, loc) {
        const card = btn.closest('.bg-white');
        const content = card.querySelector('.accordion-content');
        const arrow = card.querySelector('.lucide-chevron-down');
        
        const isNowOpen = content.classList.toggle('open');
        state.openAccordion = isNowOpen ? loc : null;
        
        arrow.classList.toggle('rotate-180', isNowOpen);
    }

    function toggleItem(id) {
        if (state.delivered.has(id)) {
            state.delivered.delete(id);
        } else {
            state.delivered.add(id);
        }
        saveLocalData();
        render();
    }

    function toggleArchive(loc, status) {
        if (status) {
            state.archived.add(loc);
            if (state.openAccordion === loc) state.openAccordion = null;
        } else {
            state.archived.delete(loc);
        }
        saveLocalData();
        render();
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
        
        const isCons = tab === 'consegne';
        document.getElementById('nav-consegne').className = isCons ? "flex flex-col items-center gap-1 text-indigo-600 scale-110 transition-all" : "flex flex-col items-center gap-1 text-slate-400 transition-all";
        document.getElementById('nav-archivio').className = !isCons ? "flex flex-col items-center gap-1 text-indigo-600 scale-110 transition-all" : "flex flex-col items-center gap-1 text-slate-400 transition-all relative";
    }

    function clearCache() {
        showConfirm("Resettare tutto?", "Verranno rimosse tutte le spunte e l'archivio verrà svuotato.", () => {
            state.delivered = new Set();
            state.archived = new Set();
            state.openAccordion = null;
            saveLocalData();
            render();
        });
    }
</script>
</body>
</html>
